[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200

[[redirects]]
  from = "/team"
  to = "/team.html"
  status = 200

[[redirects]]
  from = "/projects"
  to = "/projects.html"
  status = 200

[[redirects]]
  from = "/premangan"
  to = "/premangan.html"
  status = 200

[[redirects]]
  from = "/donate"
  to = "/donate.html"
  status = 200

[[redirects]]
  from = "/volunteer"
  to = "/volunteer.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200

[[redirects]]
  from = "/legal"
  to = "/legal.html"
  status = 200

[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap.xml"
  status = 200
  force = true

[[redirects]]
  from = "/robots.txt"
  to = "/robots.txt"
  status = 200
  force = true

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    "Content-Type" = "application/xml"
    "X-Robots-Tag" = "noindex"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    "Content-Type" = "text/plain"

# Catch-all redirect for SPA behavior (if needed)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200